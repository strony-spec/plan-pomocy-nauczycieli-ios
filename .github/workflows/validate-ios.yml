name: Validate iOS project

on:
  push:
    branches:
      - main
    paths:
      - "PlanPomocyNauczycieli/**"
      - "PlanPomocyNauczycieli.xcodeproj/**"
      - ".github/workflows/validate-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile without signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project PlanPomocyNauczycieli.xcodeproj \
            -scheme PlanPomocyNauczycieli \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
